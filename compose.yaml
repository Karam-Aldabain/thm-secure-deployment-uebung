services:
  https:
    build: ./https
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./https/certs:/etc/nginx/certs:ro
  app:
    build: ./src
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./src/app.txt:/data/app.txt:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
