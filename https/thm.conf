server {
    listen 80;
    server_name thm.de;
    return 301 https://thm.de$request_uri;
}
server {
    listen 443 ssl;
    server_name thm.de;
    ssl_certificate /etc/nginx/certs/thm.crt;
    ssl_certificate_key /etc/nginx/certs/thm.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / {
        default_type text/plain;
        return 200 "HTTPS fuer thm.de funktioniert.\n";
    }
}
